name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so env-validated modules load during type-check, build, and unit tests.
      # Real secrets live in Railway and are never present in CI.
      VITE_SERVER_URL: http://localhost:3000
      VITE_DOCS_URL: http://localhost:4321
      DATABASE_URL: postgres://ollive:ollive@localhost:5432/ollive
      CLICKHOUSE_URL: http://localhost:8123
      REDIS_URL: redis://localhost:6379
      OPENROUTER_API_KEY: ci-placeholder
      BYOK_ENCRYPTION_KEY: ci-placeholder-byok-key-at-least-32-characters
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

      # Non-blocking: surfaces pre-existing scaffold lint issues without failing CI.
      # Flip to a hard gate once the scaffold lint debt is cleared.
      - name: Lint
        run: bun run check
        continue-on-error: true

      - name: Build
        run: bun run build

      # Infra-free unit tests only. Integration tests (apps/server/tests/integration and the
      # DB/OpenRouter-backed api router tests) need PostgreSQL, ClickHouse, Valkey, and live
      # OpenRouter; run them locally with `docker compose up` + `bun run test:integration`.
      - name: Unit tests
        run: bun test packages/sdk/src apps/server/src packages/api/src/models.test.ts packages/api/src/crypto.test.ts
